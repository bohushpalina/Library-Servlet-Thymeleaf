<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<!-- Единый файл оформления. Подключается в <head> через fragments.html -->
<style th:fragment="css">
                        :root {
                            --ink: #140401;
                            --brew: #270902;        /* Root Brew */
                            --choc: #4A0D02;        /* Lonely Chocolate */
                            --copper: #7E1902;      /* New Kenyan Copper */
                            --crimson: #B52D02;     /* Crimson Velvet Sunset */
                            --orange: #D65505;      /* Exuberance */
                            --chat: #F79E3A;        /* Chat Orange */
                            --yellow: #FDDF84;      /* Swedish Yellow */
                            --text: #F5E6C8;
                            --muted: rgba(253, 223, 132, .62);
                            --line: rgba(247, 158, 58, .22);
                            --radius: 18px;
                        }
* { box-sizing: border-box; }
body {
    margin: 0; min-height: 100vh;
    font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
    color: var(--text);
    background:
            radial-gradient(1100px 560px at 88% -8%, rgba(214, 85, 5, .30), transparent 60%),
            radial-gradient(900px 520px at -8% 108%, rgba(181, 45, 2, .24), transparent 55%),
            linear-gradient(rgba(20, 4, 1, .70), rgba(20, 4, 1, .86)),
            url('../static/library.jpg') no-repeat center center / cover,
            var(--ink);
    background-attachment: fixed;
}
a { color: var(--chat); }
.display {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-weight: 900; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05;
}

/* ---------- верхнее меню ---------- */
.topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(20, 4, 1, .92); backdrop-filter: blur(8px);
    border-bottom: 2px solid var(--orange);
}
.topbar-inner {
    max-width: 1120px; margin: 0 auto; padding: 12px 20px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 26px;
}
.brand {
    font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 22px;
    text-transform: uppercase; letter-spacing: .05em; color: var(--chat); text-decoration: none;
}
.topbar a.link {
    color: var(--yellow); text-decoration: none; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .1em; padding: 6px 0; border-bottom: 2px solid transparent;
}
.topbar a.link:hover { color: var(--chat); border-bottom-color: var(--chat); }

/* ---------- страница и блоки ---------- */
.page {
    max-width: 1120px; margin: 0 auto; padding: 28px 20px 36px;
    display: flex; flex-direction: column; gap: 20px;
}
.block {
    border-radius: var(--radius); padding: 24px;
    background: linear-gradient(150deg, var(--choc), var(--brew));
    border: 1px solid var(--line);
}
.section-title {
    font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 22px;
    text-transform: uppercase; color: #fff; margin: 0; display: flex; align-items: center; gap: 12px;
}
.section-title::before { content: ''; width: 34px; height: 4px; border-radius: 2px; background: var(--orange); }
.label {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
}
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* ---------- макет 1: большой баннер + квадрат + строки ---------- */
.hero {
    min-height: 240px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
    background: linear-gradient(135deg, var(--copper), var(--choc) 55%, var(--brew));
}
.hero::after {
    content: ''; position: absolute; right: -70px; top: -70px; width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, var(--orange), transparent 70%); opacity: .55;
}
.hero h1 { margin: 0 0 10px; color: #fff; font-size: clamp(34px, 6.5vw, 68px); position: relative; z-index: 1; }
.hero p { margin: 0; color: var(--muted); max-width: 520px; position: relative; z-index: 1; }

.stat-row { display: grid; grid-template-columns: 190px 1fr; gap: 20px; }
.stat {
    aspect-ratio: 1 / 1; border-radius: var(--radius); color: #fff;
    background: linear-gradient(145deg, var(--orange), var(--crimson));
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
}
.stat .num { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 64px; line-height: 1; }
.stat .label { color: rgba(255, 255, 255, .8); margin-top: 6px; }
.kv-list { display: flex; flex-direction: column; justify-content: center; }
.kv { padding: 11px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv b { display: block; margin-top: 3px; font-size: 16px; color: #fff; }

/* ---------- макет 3: широкая полоса с кнопкой ---------- */
.strip {
    display: flex; justify-content: center; align-items: center; padding: 18px; border-radius: 999px;
    background: linear-gradient(90deg, var(--choc), var(--copper), var(--choc)); border: 1px solid var(--line);
}

/* ---------- макет 5: заголовок и колонки-карточки ---------- */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 14px; }
.col-card {
    display: flex; flex-direction: column; gap: 8px; min-height: 220px; padding: 20px;
    border-radius: var(--radius); text-decoration: none; color: var(--text);
    background: linear-gradient(160deg, var(--choc), var(--brew)); border: 1px solid var(--line);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.col-card:hover { transform: translateY(-5px); border-color: var(--chat); box-shadow: 0 10px 26px rgba(214, 85, 5, .25); }
.col-card .num { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 42px; color: var(--orange); line-height: 1; }
.col-card h3 { margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 19px; text-transform: uppercase; color: #fff; }
.col-card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }

/* ---------- макет 2: плашка-заголовок + кнопка, ниже ряд карточек ---------- */
.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
.pill {
    display: inline-block; padding: 12px 28px; border-radius: 999px; color: #fff;
    background: linear-gradient(90deg, var(--crimson), var(--orange));
}
.pill h1 { margin: 0; font-size: 22px; }
.inline-form { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.inline-form select { min-width: 270px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 14px; }
.card {
    display: flex; flex-direction: column; gap: 8px; min-height: 190px; padding: 20px;
    border-radius: var(--radius); background: linear-gradient(160deg, var(--choc), var(--brew)); border: 1px solid var(--line);
}
.card h3 { margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; text-transform: uppercase; color: #fff; }
.card .meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
.card .tag {
    align-self: flex-start; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
    letter-spacing: .08em; background: var(--orange); color: #fff;
}
.card .spacer { margin-top: auto; }

/* ---------- макет 4: большой блок сверху, слева высокий, справа два ---------- */
.bento {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    grid-template-areas: "top top" "left r1" "left r2" "send send";
}
.b-top { grid-area: top; }
.b-left { grid-area: left; }
.b-r1 { grid-area: r1; }
.b-r2 { grid-area: r2; }
.b-send { grid-area: send; }
.step { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 40px; color: var(--orange); line-height: 1; }

/* ---------- формы и кнопки ---------- */
.field { margin-top: 12px; }
.field label { display: block; margin-bottom: 8px; }
select {
    width: 100%; padding: 13px 14px; border-radius: 12px; font: inherit; font-size: 14px;
    background: var(--ink); color: var(--yellow); border: 1px solid var(--copper);
}
select:focus { outline: none; border-color: var(--chat); box-shadow: 0 0 0 3px rgba(247, 158, 58, .25); }
option { background: var(--ink); color: var(--yellow); }
.btn {
    display: inline-block; cursor: pointer; border: 0; text-decoration: none; padding: 13px 30px; border-radius: 999px;
    font: 700 13px 'Montserrat', Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #fff;
    background: linear-gradient(90deg, var(--orange), var(--crimson));
    transition: transform .15s ease, background .15s ease, color .15s ease;
}
.btn:hover { background: var(--chat); color: var(--ink); transform: translateY(-2px); }

/* ---------- сообщения ---------- */
.flash { padding: 14px 18px; border-radius: 14px; font-weight: 600; border-left: 6px solid; }
.flash.ok { background: rgba(247, 158, 58, .14); border-color: var(--chat); color: var(--yellow); }
.flash.error { background: rgba(181, 45, 2, .38); border-color: var(--crimson); color: #ffd9cc; }

/* ---------- подвал: данные о сеансе ---------- */
.site-footer {
    max-width: 1120px; margin: 0 auto; padding: 16px 20px 30px; border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 8px 30px; font-size: 12px; color: var(--muted);
}
.site-footer b { color: var(--yellow); }

/* ---------- ошибка ---------- */
.error-block { text-align: center; padding: 50px 24px; }
.error-block .code { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 90px; color: var(--orange); line-height: 1; }
.error-block p { color: var(--text); margin: 14px 0 24px; }

/* ---------- адаптивность ---------- */
@media (max-width: 720px) {
    .stat-row { grid-template-columns: 1fr; }
    .stat { aspect-ratio: auto; padding: 22px; }
    .bento { grid-template-columns: 1fr; grid-template-areas: "top" "left" "r1" "r2" "send"; }
    .inline-form select { min-width: 0; width: 100%; }
    .inline-form { width: 100%; }
}
</style>
</head>
<body></body>
</html>
